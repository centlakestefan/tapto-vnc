name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # The build stamps the binary with `git describe --tags`, which needs
          # the tags and the history between them. checkout's default is a
          # depth-1 clone with no tags fetched at all, so a release build here
          # would report a bare hash where it should name its version. Nothing
          # fails in that case, which is exactly why it would go unnoticed —
          # the smoke test below asserts the stamp instead.
          fetch-depth: 0

      # OpenSSL for the HTTPS provider APIs and for DES in VNC authentication.
      # zlib is not installed on purpose: it is fetched at configure time, and
      # a runner without it is the case that path exists for.
      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build
          -DOPENSSL_ROOT_DIR="C:/Program Files/OpenSSL"

      - name: Build
        run: cmake --build build --config Release

      # --dump-tools builds every tool schema and serialises it, so it exercises
      # the tool registry and JSON layer without needing a screen to connect to.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          ./build/tapto-vnc --dump-tools > tools.json
          count=$(jq length tools.json)
          echo "tool definitions: $count"
          test "$count" -ge 9

          # The version stamp is only as good as the checkout it was taken
          # from, and a wrong one is silent: every trace would name a build
          # that cannot be found. "no-git" means the history or the tags did
          # not arrive.
          version=$(./build/tapto-vnc --version)
          echo "$version"
          case "$version" in
            *no-git*) echo "::error::version stamp has no repository to describe"; exit 1 ;;
          esac

          # --mcp rejects the arguments that have nobody to reach, and it does
          # so before anything connects — which is what makes it testable here,
          # with no VNC server and no API key on the runner. A regression that
          # let these through would not fail; it would start a server that
          # silently dropped the task it was given.
          if ./build/tapto-vnc --mcp "open notepad" 2>/dev/null; then
            echo "::error::--mcp accepted a task instead of refusing it"; exit 1
          fi
          if ./build/tapto-vnc --mcp --mcp-port 0 2>/dev/null; then
            echo "::error::--mcp-port accepted 0"; exit 1
          fi
          if ./build/tapto-vnc --mcp-port 9000 2>/dev/null; then
            echo "::error::--mcp-port was accepted without --mcp"; exit 1
          fi

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          ./build/Release/tapto-vnc.exe --dump-tools > tools.json
          if ((Get-Content tools.json -Raw | ConvertFrom-Json).Count -lt 9) { exit 1 }
